<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moonraker-contrast</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --panel-bg: #ffffff;
    --fg: #1b1f24;
    --muted: #5b6572;
    --border: #d7dce2;
    --accent: #2f6fed;
    --accent-fg: #ffffff;
    --danger: #b3261e;
    --danger-bg: #fbe9e8;
    --add-bg: #e3f6e6;
    --add-fg: #146c2e;
    --remove-bg: #fbe9e8;
    --remove-fg: #a3241b;
    --context-fg: var(--muted);
    --badge-bg: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --panel-bg: #1c2024;
      --fg: #e7eaee;
      --muted: #9aa4b2;
      --border: #333a42;
      --accent: #5b93ff;
      --accent-fg: #0b1220;
      --danger: #ff6b63;
      --danger-bg: #3a1f1e;
      --add-bg: #123822;
      --add-fg: #6fd98c;
      --remove-bg: #3a1f1e;
      --remove-fg: #ff8a82;
      --context-fg: var(--muted);
      --badge-bg: #262b31;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  header {
    padding: 1.25rem 1.5rem 0.5rem;
  }
  header h1 {
    margin: 0 0 0.15rem;
    font-size: 1.4rem;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 0.5rem 1.5rem 3rem;
  }
  nav.tabs {
    display: flex;
    gap: 0.5rem;
    margin: 1rem 0;
    border-bottom: 1px solid var(--border);
  }
  nav.tabs button {
    background: none;
    border: none;
    padding: 0.6rem 1rem;
    font-size: 0.95rem;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav.tabs button[aria-selected="true"] {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
  }
  .panel[hidden] { display: none; }
  .sub-toggle {
    display: flex;
    gap: 1.25rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }
  .sub-toggle label { display: flex; align-items: center; gap: 0.35rem; cursor: pointer; }
  .picker-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  @media (max-width: 640px) {
    .picker-grid { grid-template-columns: 1fr; }
  }
  .picker-col label.col-label {
    display: block;
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 0.35rem;
  }
  .picker-col input[type="search"] {
    width: 100%;
    padding: 0.4rem 0.55rem;
    margin-bottom: 0.4rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font-size: 0.85rem;
  }
  .picker-col select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font-size: 0.82rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .picker-col select option { padding: 0.2rem; }
  .row-check {
    margin-top: 1rem;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .actions {
    margin-top: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.3rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .spinner {
    display: none;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #results { margin-top: 1.5rem; }
  #results[hidden] { display: none; }
  #error-banner {
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }
  #error-banner[hidden] { display: none; }
  #error-banner .hint { display: block; margin-top: 0.3rem; color: var(--muted); }
  .badges {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .badge {
    background: var(--badge-bg);
    border-radius: 999px;
    padding: 0.3rem 0.8rem;
    font-size: 0.82rem;
  }
  .badge strong { margin-right: 0.3rem; }
  details {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 0.75rem;
    padding: 0.5rem 0.8rem;
  }
  details summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0.25rem 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
    margin-top: 0.5rem;
  }
  table th, table td {
    text-align: left;
    padding: 0.35rem 0.5rem;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    word-break: break-word;
  }
  table th { color: var(--muted); font-weight: 600; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85em;
  }
  ul.plain-list {
    columns: 2;
    margin: 0.5rem 0 0;
    padding-left: 1.1rem;
    font-size: 0.82rem;
  }
  @media (max-width: 640px) {
    ul.plain-list { columns: 1; }
  }
  .hunk-header {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.78rem;
    color: var(--muted);
    margin: 0.9rem 0 0.2rem;
  }
  table.diff-table td.lineno {
    width: 2.5rem;
    text-align: right;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.75rem;
    user-select: none;
  }
  table.diff-table td.diff-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    white-space: pre-wrap;
  }
  tr.diff-add td.diff-text { background: var(--add-bg); color: var(--add-fg); }
  tr.diff-remove td.diff-text { background: var(--remove-bg); color: var(--remove-fg); }
  tr.diff-context td.diff-text { color: var(--context-fg); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    padding: 1rem;
  }
</style>
</head>
<body>
<header>
  <h1>moonraker-contrast</h1>
  <p>Compare slicer settings between two gcode files, or diff two config files.</p>
</header>
<main>
  <nav class="tabs" role="tablist">
    <button type="button" id="tab-gcode" role="tab" aria-selected="true">Gcode</button>
    <button type="button" id="tab-config" role="tab" aria-selected="false">Config</button>
  </nav>

  <section id="panel-gcode" class="panel">
    <div class="picker-grid">
      <div class="picker-col">
        <label class="col-label">File 1</label>
        <input type="search" id="filter-gcode-1" placeholder="Filter files…">
        <select id="select-gcode-1" size="8"></select>
      </div>
      <div class="picker-col">
        <label class="col-label">File 2</label>
        <input type="search" id="filter-gcode-2" placeholder="Filter files…">
        <select id="select-gcode-2" size="8"></select>
      </div>
    </div>
    <label class="row-check">
      <input type="checkbox" id="include-same"> Include unchanged values in results
    </label>
    <div class="actions">
      <button type="button" class="primary" id="compare-gcode-btn" disabled>Compare</button>
      <span class="spinner" id="spinner-gcode">Comparing…</span>
    </div>
  </section>

  <section id="panel-config" class="panel" hidden>
    <div class="sub-toggle">
      <label><input type="radio" name="config-sub-mode" value="values" checked> Values (semantic diff)</label>
      <label><input type="radio" name="config-sub-mode" value="text"> Text (literal line diff)</label>
    </div>
    <div class="picker-grid">
      <div class="picker-col">
        <label class="col-label">File 1</label>
        <input type="search" id="filter-config-1" placeholder="Filter files…">
        <select id="select-config-1" size="8"></select>
      </div>
      <div class="picker-col">
        <label class="col-label">File 2</label>
        <input type="search" id="filter-config-2" placeholder="Filter files…">
        <select id="select-config-2" size="8"></select>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="compare-config-btn" disabled>Compare</button>
      <span class="spinner" id="spinner-config">Comparing…</span>
    </div>
  </section>

  <section id="results" hidden>
    <div id="error-banner" hidden></div>
    <div id="results-body"></div>
  </section>
</main>
<footer>moonraker-contrast</footer>

<script type="module" src="app.js"></script>
</body>
</html>
