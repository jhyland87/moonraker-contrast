# moonraker-contrast :: cross-slicer setting mappings
# ===================================================================
# This file aligns equivalent settings across slicers that name (or scale)
# them differently, so the comparison can treat them as one logical setting.
#
# FORMAT (INI / configparser -- same as moonraker.conf):
#
#   [canonical <logical_name>]
#   <slicer> = <that slicer's raw key>[ | <transform>]
#
#   <slicer> is one of: prusaslicer, superslicer, orcaslicer,
#                       bambustudio, bambuslicer   (case-insensitive)
#
# TRANSFORMS (applied to bring each slicer's value into canonical space):
#   identity            value unchanged (default)
#   invert_number       negate the number            (e.g.  0.2 <-> -0.2)
#   invert_bool         flip a boolean
#   as_bool             coerce 0/1/true/false to a real bool (so 1 == true)
#   percent_to_float    "75%" -> 0.75
#   float_to_percent    0.75  -> "75%"
#   scale:<factor>      multiply by <factor>         (e.g. scale:25.4 for in->mm)
#
# NOTES:
#   * Any setting NOT listed here is still compared -- but only against the
#     SAME raw key on the other file (no cross-slicer renaming). Adding a
#     mapping here is purely additive: it teaches the tool that two
#     differently-named keys are the same setting.
#   * Editing this file takes effect immediately (Moonraker need not restart).
#   * Add as many [canonical ...] sections as you like.
# ===================================================================

[settings]
# Numeric settings within this absolute tolerance are considered equal.
float_tolerance = 1e-6


# --- First layer height -------------------------------------------------------
# Prusa/Super use first_layer_height; Orca/Bambu use initial_layer_print_height.
[canonical first_layer_height]
prusaslicer = first_layer_height
superslicer = first_layer_height
orcaslicer  = initial_layer_print_height
bambustudio = initial_layer_print_height
bambuslicer = initial_layer_print_height


# --- Elephant foot compensation ----------------------------------------------
# Prusa family call it elefant_foot_compensation (positive shrink at z=0).
# BambuStudio expresses the same idea via xy_contour_compensation, which uses
# the opposite sign, so we invert it into canonical space.
[canonical elephant_foot_compensation]
prusaslicer = elefant_foot_compensation
superslicer = elefant_foot_compensation
orcaslicer  = elefant_foot_compensation
bambustudio = xy_contour_compensation | invert_number
bambuslicer = xy_contour_compensation | invert_number


# --- Brim separation / gap ----------------------------------------------------
[canonical brim_separation]
prusaslicer = brim_separation
superslicer = brim_separation
orcaslicer  = brim_object_gap
bambustudio = brim_object_gap
bambuslicer = brim_object_gap


# --- Infill density -----------------------------------------------------------
# Prusa/Super store "20%"; Orca/Bambu store sparse_infill_density (also "20%").
# Kept as-is here; if a profile ever stores a bare float, add percent_to_float.
[canonical fill_density]
prusaslicer = fill_density
superslicer = fill_density
orcaslicer  = sparse_infill_density
bambustudio = sparse_infill_density
bambuslicer = sparse_infill_density


# --- Spiral vase / mode -------------------------------------------------------
# Compared as real booleans so 1 == "true" == "1".
[canonical spiral_vase]
prusaslicer = spiral_vase | as_bool
superslicer = spiral_vase | as_bool
orcaslicer  = spiral_mode | as_bool
bambustudio = spiral_mode | as_bool
bambuslicer = spiral_mode | as_bool


# --- Supports enabled ---------------------------------------------------------
[canonical supports_enabled]
prusaslicer = support_material | as_bool
superslicer = support_material | as_bool
orcaslicer  = enable_support | as_bool
bambustudio = enable_support | as_bool
bambuslicer = enable_support | as_bool


# --- Perimeters / wall loops --------------------------------------------------
[canonical wall_count]
prusaslicer = perimeters
superslicer = perimeters
orcaslicer  = wall_loops
bambustudio = wall_loops
bambuslicer = wall_loops


# --- Top solid layers ---------------------------------------------------------
[canonical top_solid_layers]
prusaslicer = top_solid_layers
superslicer = top_solid_layers
orcaslicer  = top_shell_layers
bambustudio = top_shell_layers
bambuslicer = top_shell_layers


# --- Bottom solid layers ------------------------------------------------------
[canonical bottom_solid_layers]
prusaslicer = bottom_solid_layers
superslicer = bottom_solid_layers
orcaslicer  = bottom_shell_layers
bambustudio = bottom_shell_layers
bambuslicer = bottom_shell_layers
